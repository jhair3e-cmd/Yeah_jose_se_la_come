<!-- Ventana del video -->

<div id="ventanaVideo" style="
display: none;
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0,0,0,0.9);
justify-content: center;
align-items: center;
z-index: 999;
">

<div style="text-align: center;">

<video id="reproductor" controls style="
width: 80%;
max-width: 700px;
">

</video>

<br><br>

<button onclick="cerrarVideo()" style="
padding: 10px 25px;
background: lime;
color: black;
font-family: 'Lucida Console', monospace;
cursor: pointer;
">
CERRAR VIDEO
</button>

</div>
</div>

<script>

function abrirVideo(archivo) {
    var ventana = document.getElementById("ventanaVideo");
    var video = document.getElementById("reproductor");

    video.src = archivo;
    ventana.style.display = "flex";
    video.play();
}

function cerrarVideo() {
    var ventana = document.getElementById("ventanaVideo");
    var video = document.getElementById("reproductor");

    video.pause();
    video.src = "";
    ventana.style.display = "none";
}

</script>
